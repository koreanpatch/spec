lexicon: 1
id: app.bsky.spec.irt_item_params
description: >
  Fitted 2PL IRT parameters for a single item (lemma or morpheme pattern).
  One record per item, key = item_id. Updated each calibration run as more
  learner response data accumulates.

  These parameters are the authoritative item difficulty and discrimination
  estimates for the SPEC scoring system. b_i initializes BKT difficulty priors;
  a_i informs adaptive item selection.

defs:
  main:
    type: record
    key: ref
    record:
      type: object
      required:
        - itemId
        - itemType
        - aI
        - bI
        - seA
        - seB
        - numResponses
        - calibrationRunId
        - calibratedAt
        - model

      properties:

        itemId:
          type: string
          description: >
            Item identifier. Format: dict:lemma:{id} or dict:pattern:{id}.
            Must match the itemId referenced in encounter and BKT records.

        itemType:
          type: string
          enum:
            - lemma
            - pattern
          description: Whether this is a vocabulary lemma or a morpheme/grammar pattern.

        aI:
          type: number
          minimum: 0.01
          description: >
            Item discrimination (slope parameter). Controls how sharply
            ability maps to probability of correct response.
            Range: 0.5 to 2.5 typical. a=2 means high discrimination,
            a=0.5 means the item does not discriminate well between ability levels.

        bI:
          type: number
          description: >
            Item difficulty on the logit scale. At theta=b_i, P(Y=1)=0.50.
            b_i < 0: easier than average. b_i > 0: harder than average.
            Typical range: -2.0 to +3.0.

        seA:
          type: number
          minimum: 0
          description: Standard error of a_i estimate.

        seB:
          type: number
          minimum: 0
          description: Standard error of b_i estimate.

        numResponses:
          type: integer
          minimum: 30
          description: >
            Number of learner responses used in this calibration.
            Minimum 30 required for stable fit.

        calibrationRunId:
          type: string
          maxLength: 128
          description: >
            Links to the irt_calibration_run record that produced these parameters.

        calibratedAt:
          type: string
          format: datetime
          description: When these parameters were fitted (UTC).

        model:
          type: string
          enum:
            - 1PL
            - 2PL
          default: 2PL
          description: IRT model used for estimation.

        fitStatistics:
          type: object
          properties:
            logLikelihood:
              type: number
            AIC:
              type: number
            BIC:
              type: number
            df:
              type: integer
            chiSquare:
              type: number
          description: Model fit statistics for this item.

        infit:
          type: number
          description: >
            Infit statistic (information-weighted mean square).
            Values > 1.3 indicate items that do not fit the model well
            at the ability levels where most learners operate.

        outfit:
          type: number
          description: >
            Outfit statistic (unweighted mean square).
            Values > 1.3 indicate items with unexpected responses
            from learners far from the item's difficulty level.

        domain:
          type: string
          description: >
            Domain for domain-specific calibration (webtoon, news, academic, etc.).
            Items calibrated within a specific domain may have different b_i values.
