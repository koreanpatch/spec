lexicon: 1
id: tools.spec.event.sentence.read
description: >
  User read a sentence or passage during reading. This event is the authoritative
  source for sourceId — all word.saved and morpheme.encountered events reference
  back to this record via sourceId.
defs:
  main:
    type: record
    key: tid
    extends: tools.spec.event.defs#signedEventBase
    record:
      type: object
      required:
        - sourceId
        - languageCode
        - readAt
      properties:
        sourceId:
          type: string
          description: >
            Globally unique identifier for this sentence read event.
            Authoritative sourceId used by downstream word.saved and morpheme.encountered events.
            Format: sha256(sentenceText + userDid + readAt) or application-assigned UUID.
        sentence:
          type: string
          description: The full sentence text that was read
        wordCount:
          type: integer
          minimum: 1
          description: Number of words (eojeol) in the sentence
        languageCode:
          type: string
          maxLength: 10
          default: ko
        difficulty:
          type: integer
          minimum: 0
          maximum: 10000
        readAt:
          type: string
          format: datetime
        register:
          type: string
          enum:
            - formal_written
            - formal_speech
            - informal_speech
            - colloquial
            - literary
          default: formal_written
          description: Register of the sentence content
