lexicon: 1
id: app.bsky.spec.irt_ability_state
description: >
  Current ability estimate for a learner from IRT calibration.
  One record per learner, key = "self" (updated in place each calibration run).

  theta_u is on the logit scale. For reference:
    theta = -2: beginner (top ~2% of items accessible)
    theta = -1: elementary  
    theta =  0: intermediate (average, top ~50% of items accessible)
    theta = +1: advanced
    theta = +2: superior

  This record supplements BKT knowledge-state tracking (bkt_param_fit_result):
  BKT tracks "what does the learner know?" while IRT tracks
  "how well can the learner perform?" — complementary signals.

defs:
  main:
    type: record
    key: self
    record:
      type: object
      required:
        - learnerDid
        - theta
        - seTheta
        - calibrationRunId
        - updatedAt
        - numItemsAnswered
        - abilityBand

      properties:

        learnerDid:
          type: string
          format: did
          description: The learner whose ability was estimated.

        theta:
          type: number
          description: >
            Ability estimate on the logit scale. Range typically [-3, +3].
            At theta=b_i, learner has 50% chance of correct response on item i.

        seTheta:
          type: number
          minimum: 0
          maximum: 2
          description: >
            Standard error of theta estimate. Higher SE means fewer
            response observations or more inconsistent performance.

        calibrationRunId:
          type: string
          maxLength: 128
          description: Links to the irt_calibration_run that produced this estimate.

        updatedAt:
          type: string
          format: datetime
          description: When this ability estimate was computed (UTC).

        numItemsAnswered:
          type: integer
          minimum: 1
          description: Total number of items the learner has responded to in this calibration run.

        abilityBand:
          type: string
          enum:
            - beginner
            - elementary
            - intermediate
            - advanced
            - superior
          description: >
            Broad ability band for UI display and adaptive routing.
            Mapping: beginner<-2, elementary<-1, intermediate<0, advanced<+1, superior>=+2
            More precisely: band computed from theta distribution percentiles.

        domain:
          type: string
          description: >
            Domain this ability estimate applies to.
            If null, this is an overall ability estimate.
            Domain-specific ability estimates allow cross-domain transfer learning.
