lexicon: 1
id: tools.spec.mining.sentence.captured
description: >
  A learner captured a Korean sentence for mining. See RFC 014 in
  spec-research-suite/docs/lexicons/proposals/014_mining_and_sentence_card.md.

  Korean examples:
    "한국 김치는 정말 맛있다." (miningId=sha256, items=[{entityRef:김치}], primary)
    "봉준호 감독의 새 영화가 개봉했다." (items=[{entityRef:봉준호, person}, {entityRef:영화, noun}, {entityRef:감독, noun}])
defs:
  main:
    type: record
    key: tid
    extends: tools.spec.event.defs#signedEventBase
    record:
      type: object
      required:
        - learnerDid
        - sourceId
        - miningId
        - sentenceSurface
        - sentenceNormalised
        - items
        - capturedAt
      properties:
        learnerDid:
          type: string
          format: did
        sourceId:
          type: string
          maxLength: 256
        miningId:
          type: string
          maxLength: 128
          description: sha256(learnerDid + sourceId + sentenceSurface + items snapshot).
        sentenceSurface:
          type: string
          maxLength: 1024
        sentenceNormalised:
          type: string
          maxLength: 1024
          description: NFC-normalized form. Used for hashing.
        sentenceTranslation:
          type: string
          maxLength: 1024
        sourceMetadata:
          type: object
          properties:
            sourceUrl:
              type: string
              format: uri
            sourceDomain:
              type: string
              maxLength: 64
            sourceTitle:
              type: string
              maxLength: 256
            sourceAuthor:
              type: string
              maxLength: 128
            sourcePublishedAt:
              type: string
              format: datetime
            mediaType:
              type: string
              enum:
                - text
                - webtoon
                - video_subtitles
                - audio_transcript
                - book
            audioRef:
              type: string
              maxLength: 256
            clipStartMs:
              type: integer
              minimum: 0
            clipEndMs:
              type: integer
              minimum: 0
        items:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            properties:
              lemmaRef:
                type: object
                ref: tools.spec.event.encounter_defs#hostLemmaRef
              morphemePatternId:
                type: string
                maxLength: 128
              grammarPatternId:
                type: string
                maxLength: 128
              compoundRef:
                type: object
                properties:
                  compositeLemma:
                    type: object
                    ref: tools.spec.event.encounter_defs#hostLemmaRef
                  compoundType:
                    type: string
                    enum:
                      - verbal
                      - noun_native
                      - noun_hanja
                      - noun_hybrid
              entityRef:
                type: object
                ref: tools.spec.event.encounter_defs#hostLemmaRef
              itemRole:
                type: string
                enum:
                  - primary
                  - secondary
              eojeolSurface:
                type: string
                maxLength: 64
              eojeolOffset:
                type: integer
                minimum: 0
              characterRange:
                type: object
                properties:
                  start:
                    type: integer
                    minimum: 0
                  end:
                    type: integer
                    minimum: 0
            required:
              - itemRole
              - eojeolSurface
        observedFormalityTier:
          type: string
          ref: tools.spec.event.encounter_defs#formalityTier
        observedSituationalRegisters:
          type: array
          items:
            type: string
            ref: tools.spec.event.encounter_defs#situationalRegisterCode
        observedSpeechStyles:
          type: array
          items:
            type: string
            ref: tools.spec.event.encounter_defs#speechStyleCode
        observedSensitivityClass:
          type: string
          ref: tools.spec.event.encounter_defs#sensitivityClass
        dialectProfileId:
          type: string
          ref: tools.spec.event.encounter_defs#dialectProfileId
        dialectSurface:
          type: string
          maxLength: 64
        confidence:
          type: number
          ref: tools.spec.event.encounter_defs#resolverConfidence
        isNativeClozeCandidate:
          type: boolean
        cardCount:
          type: integer
          minimum: 0
          default: 0
        firstCardedAt:
          type: string
          format: datetime
