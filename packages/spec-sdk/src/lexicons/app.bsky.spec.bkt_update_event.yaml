lexicon: 1
id: app.bsky.spec.bkt_update_event
description: >
  Output of the BKT (Bayesian Knowledge Tracing) fitter for one learner batch.
  One record written per BKT fitter run per learner. Groups all per-item W_i updates
  from that run along with provenance refs to the encounters that triggered them.

  This record is the *output* of the fitting process — the raw learner encounters
  are captured in tools.spec.event.word.saved and tools.spec.event.morpheme.encountered.
  This record captures the derived knowledge-state update.

  Written to the learner's own PDS for portability. Supabase holds the mutable
  user_lexicon_state (W_i per item); this record provides immutable audit trail.

defs:
  main:
    type: record
    key: tid
    record:
      type: object
      required:
        - userDid
        - itemType
        - updatedAt
        - sessionId
        - encounterCount
        - paramSnapshot
        - itemUpdates

      properties:

        userDid:
          type: string
          format: did
          description: The learner whose knowledge state was updated. did:plc:... format.

        itemType:
          type: string
          enum:
            - lemma
            - pattern
          description: >
            Which class of items were updated in this batch.
            lemma = Korean vocabulary lemmas (C_lex track)
            pattern = grammatical morpheme patterns (C_morph track)

        updatedAt:
          type: string
          format: datetime
          description: When the BKT fitter wrote this update (UTC).

        sessionId:
          type: string
          maxLength: 128
          description: >
            Groups all records from one BKT fitter invocation.
            Must match sessionId in the corresponding bkt_param_fit_result.
            Format recommendation: bkt-fit-{date}-{sequence}
            Example: bkt-fit-2026-05-15-001

        encounterCount:
          type: integer
          minimum: 1
          description: >
            Total number of encounter events processed in this batch.
            Must equal len(itemUpdates).

        paramSnapshot:
          type: object
          required:
            - pL0
            - pT
            - pG
            - pS
            - tau
            - decayRateLambda
          properties:
            pL0:
              type: number
              minimum: 0
              maximum: 1
              description: >
                Initial probability P(learner knew item before any exposure).
                Default 0.20 for lemmas, 0.15 for patterns.
            pT:
              type: number
              minimum: 0
              maximum: 1
              description: >
                Transit probability P(learner will acquire item on this encounter).
                Default 0.15 for lemmas, 0.10 for patterns.
            pG:
              type: number
              minimum: 0
              maximum: 1
              description: Guess probability P(learner answers correctly by guessing). Default 0.20.
            pS:
              type: number
              minimum: 0
              maximum: 1
              description: Slip probability P(learner makes a mistake despite knowing). Default 0.10 for lemmas, 0.15 for patterns.
            tau:
              type: number
              minimum: 0
              maximum: 1
              default: 0.60
              description: Knowledge threshold. Items with posterior_W >= tau are counted as known.
            decayRateLambda:
              type: number
              description: >
                Exponential decay rate (per day) applied between sessions.
                lambda = 0.005/day for lemmas, 0.003/day for patterns.
                W_i(t) = W_i(t_last) * exp(-lambda * days_elapsed)

        itemUpdates:
          type: array
          items:
            type: object
            required:
              - itemId
              - priorW
              - posteriorW
              - y
              - daysSinceLast
            properties:
              itemId:
                type: string
                description: >
                  Item identifier. Format: dict:lemma:{id} or dict:pattern:{id}.
                  Must match the itemId in the referenced encounter event.
              priorW:
                type: number
                minimum: 0
                maximum: 1
                description: BKT knowledge probability before this update.
              posteriorW:
                type: number
                minimum: 0
                maximum: 1
                description: BKT knowledge probability after this update (post Bayes + decay).
              y:
                type: integer
                enum:
                  - 0
                  - 1
                description: >
                  Encounter outcome. 1 = correct/passive encounter. 0 = incorrect/explicit lookup.
                  Used in the BKT Bayes update formula.
              daysSinceLast:
                type: number
                minimum: 0
                description: Days elapsed since previous encounter. Used for exponential decay.
              difficultyDelta:
                type: integer
                description: Change in item's difficulty score since last update (optional).

        eventRefs:
          type: array
          items:
            type: string
          description: >
            AT URI references to the encounter events that triggered this batch.
            Points to tools.spec.event.word.saved or tools.spec.event.morpheme.encountered records.

        fittedBy:
          type: string
          format: did
          description: DID of the service that ran the BKT fitter.
