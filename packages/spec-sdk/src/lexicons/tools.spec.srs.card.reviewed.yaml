lexicon: 1
id: tools.spec.srs.card.reviewed
description: >
  A learner completed a review of an SRS card. Carries the review
  outcome (again | hard | good | easy), the new SRS state, and the
  BKT-grade Y. See RFC 013 in
  spec-research-suite/docs/lexicons/proposals/013_srs_card_and_review_outcome.md.
defs:
  main:
    type: record
    key: tid
    extends: tools.spec.event.defs#signedEventBase
    record:
      type: object
      required:
        - learnerDid
        - cardKey
        - reviewedAt
        - reviewOutcome
        - Y
        - newState
      properties:
        learnerDid:
          type: string
          format: did
        cardKey:
          type: string
          maxLength: 128
          description: FK to tools.spec.srs.card.created.cardKey.
        reviewedAt:
          type: string
          format: datetime
        sessionId:
          type: string
          maxLength: 128
        reviewOutcome:
          type: string
          enum:
            - again
            - hard
            - good
            - easy
        Y:
          type: integer
          enum: [0, 1]
          description: again, hard → 0; good, easy → 1.
        latencyMs:
          type: integer
          minimum: 0
        isFirstReview:
          type: boolean
        isLapse:
          type: boolean
        newState:
          type: object
          properties:
            scheduler:
              type: string
              enum:
                - fsrs
                - sm2
                - anki_default
            stability:
              type: number
              minimum: 0
            difficulty:
              type: number
              minimum: 0
              maximum: 1
            nextDueAt:
              type: string
              format: datetime
            intervalDays:
              type: integer
              minimum: 0
            retrievability:
              type: number
              minimum: 0
              maximum: 1
          required:
            - scheduler
            - nextDueAt
        itemType:
          type: string
          enum:
            - lemma
            - morpheme
            - grammar_pattern
            - compound
            - entity
        sourceId:
          type: string
          maxLength: 256
        confidence:
          type: number
          ref: tools.spec.event.encounter_defs#resolverConfidence
        reviewCount:
          type: integer
          minimum: 1
        firstReviewedAt:
          type: string
          format: datetime
