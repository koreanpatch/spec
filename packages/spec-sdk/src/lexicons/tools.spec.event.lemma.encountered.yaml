lexicon: 1
id: tools.spec.event.lemma.encountered
description: >
  A lemma was encountered by a learner in a Korean text. Companion
  event to tools.spec.event.morpheme.encountered. See RFC 008 in
  spec-research-suite/docs/lexicons/proposals/008_lemma_encounter_atproto.md.

  Korean examples:
    학교에서 (hostLemma=학교, eojeol=학교에서, role=modifier in 학교앞)
    먹으려고 (hostLemma=먹다, eojeol=먹으려고, but a morpheme.encountered
    for -으려고 is also emitted)
defs:
  main:
    type: record
    key: tid
    extends: tools.spec.event.defs#signedEventBase
    record:
      type: object
      required:
        - learnerDid
        - sourceId
        - hostEojeol
        - hostLemma
        - outcome
        - encounteredAt
      properties:
        learnerDid:
          type: string
          format: did
        sourceId:
          type: string
          maxLength: 256
          description: Reference to the parent sentence.read event.
        hostLemma:
          type: object
          description: Resolved host lemma (5-char base62 id or headword-group id).
          ref: tools.spec.event.encounter_defs#hostLemmaRef
        hostEojeol:
          type: object
          description: Eojeol (whitespace-delimited unit) and its position.
          ref: tools.spec.event.encounter_defs#hostEojeol
        outcome:
          type: string
          ref: tools.spec.event.encounter_defs#encounterOutcome
        Y:
          type: integer
          enum: [0, 1]
          description: Precomputed BKT-grade Y from outcome.
        isFirstEncounter:
          type: boolean
        compoundHint:
          type: object
          description: Present when the host eojeol is part of a compound.
          properties:
            compoundType:
              type: string
              enum:
                - verbal
                - noun_native
                - noun_hanja
                - noun_hybrid
            isHeadComponent:
              type: boolean
            componentRole:
              type: string
              enum: [head_noun, modifier, coordinate]
          required:
            - compoundType
        confidence:
          type: number
          ref: tools.spec.event.encounter_defs#resolverConfidence
        encounterCount:
          type: integer
          minimum: 1
        firstEncounteredAt:
          type: string
          format: datetime
        dictionaryRefs:
          type: array
          items:
            type: object
            ref: tools.spec.event.encounter_defs#dictionaryColumnRef
        sentenceContext:
          type: object
          properties:
            surfaceSentence:
              type: string
              maxLength: 512
            sourceUrl:
              type: string
              format: uri
            sourceDomain:
              type: string
              maxLength: 64
            languageCode:
              type: string
              maxLength: 10
              default: ko
