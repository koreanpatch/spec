lexicon: 1
id: tools.spec.event.register.observed
description: >
  A learner observed a Korean lexeme in a usage that exercised one or
  more of the five register axes. Observation, not outcome. See
  RFC 010 in
  spec-research-suite/docs/lexicons/proposals/010_register_and_dialect_encounter_atproto.md.
defs:
  main:
    type: record
    key: tid
    extends: tools.spec.event.defs#signedEventBase
    record:
      type: object
      required:
        - learnerDid
        - sourceId
        - hostEojeol
        - hostLemma
        - observedFormalityTier
        - observedAt
      properties:
        learnerDid:
          type: string
          format: did
        sourceId:
          type: string
          maxLength: 256
        hostEojeol:
          type: object
          ref: tools.spec.event.encounter_defs#hostEojeol
        hostLemma:
          type: object
          ref: tools.spec.event.encounter_defs#hostLemmaRef
        observedFormalityTier:
          type: string
          ref: tools.spec.event.encounter_defs#formalityTier
        observedLexicalElevation:
          type: string
          ref: tools.spec.event.encounter_defs#lexicalElevationType
        observedSituationalRegisters:
          type: array
          items:
            type: string
            ref: tools.spec.event.encounter_defs#situationalRegisterCode
        observedSpeechStyles:
          type: array
          items:
            type: string
            ref: tools.spec.event.encounter_defs#speechStyleCode
        observedSensitivityClass:
          type: string
          ref: tools.spec.event.encounter_defs#sensitivityClass
        sourceRegister:
          type: string
          enum:
            - formal_written
            - formal_speech
            - informal_speech
            - colloquial
            - literary
          description: Coarse legacy register from signedEventBase. Sunset 2026-09-01.
        encounterCount:
          type: integer
          minimum: 1
        firstEncounteredAt:
          type: string
          format: datetime
        dictionaryRefs:
          type: array
          items:
            type: object
            ref: tools.spec.event.encounter_defs#dictionaryColumnRef
        sentenceContext:
          type: object
          properties:
            surfaceSentence:
              type: string
              maxLength: 512
            sourceUrl:
              type: string
              format: uri
            sourceDomain:
              type: string
              maxLength: 64
            languageCode:
              type: string
              maxLength: 10
              default: ko
