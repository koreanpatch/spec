lexicon: 1
id: tools.spec.lifecycle.stage.promoted
description: >
  A learner has been promoted to a new stage. Fired when bkt_param_fit_result
  computes a new stage greater than the previous stage.

  This is a lightweight notification event for downstream consumers
  (badges, leaderboard, push notifications). It does not replace
  bkt_param_fit_result which remains the authoritative state record.

defs:
  main:
    type: record
    key: tid
    record:
      type: object
      required:
        - learnerDid
        - fromStage
        - toStage
        - vAtPromotion
        - mAtPromotion
        - promotedAt
        - sessionId
        - sourceEventRef

      properties:

        learnerDid:
          type: string
          format: did
          description: The learner who was promoted. did:plc:... format.

        fromStage:
          type: integer
          minimum: 0
          maximum: 10
          description: >
            Stage before promotion. 0 = pre-stage-1 (never reached any stage).
            Used to compute total stage promotions in lifetime.

        toStage:
          type: integer
          minimum: 1
          maximum: 10
          description: Stage after promotion. Must be fromStage + 1.

        vAtPromotion:
          type: integer
          description: >
            V_S (known lemmas) at time of promotion.
            Used to verify promotion validity and for analytics.

        mAtPromotion:
          type: integer
          description: >
            M_S (known patterns) at time of promotion.
            Used to verify promotion validity and for analytics.

        promotedAt:
          type: string
          format: datetime
          description: UTC timestamp when promotion was computed.

        sessionId:
          type: string
          maxLength: 128
          description: >
            The BKT fitting session that produced this promotion.
            Must match sessionId in the triggering bkt_param_fit_result.

        sourceEventRef:
          type: string
          description: >
            AT URI reference to the bkt_param_fit_result record that triggered this event.
            Format: at://did:plc:.../app.bsky.spec.bkt_param_fit_result/{tid}

        abilityBand:
          type: string
          enum:
            - beginner
            - elementary
            - intermediate
            - advanced
            - superior
          description: >
            IRT ability band at time of promotion (from irt_ability_state if available).
            Enables downstream enrichment: "S5 learner at advanced ability".

        languageCode:
          type: string
          maxLength: 10
          default: ko
          description: Language context (ko for Korean learning).

        register:
          type: string
          enum:
            - formal_written
            - formal_speech
            - informal_speech
            - colloquial
            - literary
          default: formal_written
          description: Register of the content active during this session.

        milestoneType:
          type: string
          enum:
            - beginner_promotion
            - stage_5
            - stage_10
            - advanced
            - superior
          description: >
            Milestone label for badge assignment.
            beginner_promotion: any first promotion (fromStage=0)
            stage_5: reached S5
            stage_10: reached S10
            advanced: reached S7+
            superior: reached S10