lexicon: 1
id: tools.spec.event.grammar_pattern.encountered
description: >
  A learner encountered a Korean grammar pattern that maps to a row
  in dict.grammar_patterns. Companion to morpheme.encountered. See
  RFC 012 in
  spec-research-suite/docs/lexicons/proposals/012_grammar_pattern_encounter_atproto.md.

  Korean examples:
    공부하고 싶었다 → patternId=pat:grammar:V-고-싶다
    먹어도 된다    → patternId=pat:grammar:-아-어도-되다
defs:
  main:
    type: record
    key: tid
    extends: tools.spec.event.defs#signedEventBase
    record:
      type: object
      required:
        - learnerDid
        - sourceId
        - hostEojeol
        - patternId
        - outcome
        - encounteredAt
      properties:
        learnerDid:
          type: string
          format: did
        sourceId:
          type: string
          maxLength: 256
        patternId:
          type: string
          maxLength: 128
          description: >
            pat:grammar:<dict.grammar_patterns.id>. Distinct from
            pat:spec:v1: morpheme pattern ids.
        patternLabel:
          type: string
          maxLength: 128
        patternStage:
          type: integer
          minimum: 1
          maximum: 10
        patternDifficulty:
          type: integer
          minimum: 0
          maximum: 10000
        hostEojeol:
          type: object
          ref: tools.spec.event.encounter_defs#hostEojeol
        hostLemma:
          type: object
          ref: tools.spec.event.encounter_defs#hostLemmaRef
        composingMorphemes:
          type: array
          items:
            type: object
            properties:
              morphemePatternId:
                type: string
              surface:
                type: string
                maxLength: 16
              positionInPattern:
                type: integer
                minimum: 0
            required:
              - morphemePatternId
              - positionInPattern
        isCrossEojeol:
          type: boolean
        eojeolRange:
          type: object
          properties:
            startOffset:
              type: integer
              minimum: 0
            endOffset:
              type: integer
              minimum: 0
            surface:
              type: string
              maxLength: 256
        outcome:
          type: string
          ref: tools.spec.event.encounter_defs#encounterOutcome
        Y:
          type: integer
          enum: [0, 1]
        isFirstEncounter:
          type: boolean
        confidence:
          type: number
          ref: tools.spec.event.encounter_defs#resolverConfidence
        encounterCount:
          type: integer
          minimum: 1
        firstEncounteredAt:
          type: string
          format: datetime
        dictionaryRefs:
          type: array
          items:
            type: object
            ref: tools.spec.event.encounter_defs#dictionaryColumnRef
        sentenceContext:
          type: object
          properties:
            surfaceSentence:
              type: string
              maxLength: 512
            sourceUrl:
              type: string
              format: uri
            sourceDomain:
              type: string
              maxLength: 64
            languageCode:
              type: string
              maxLength: 10
              default: ko
