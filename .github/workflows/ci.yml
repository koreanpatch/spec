name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NOTE: `pnpm build` is currently expected to fail on spec-sdk due to a
      # known, documented codegen bug (scripts/generate.ts expects .yaml
      # lexicon sources; only .json files are checked in today). See the
      # "Known build issues" section in AGENTS.md / CLAUDE.md before treating
      # a red build step here as a regression caused by your change.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
